#
# Additional configuration options for e-paper display support
#

CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_SSD16XX=y

# LVGL — 1-bit mono, full-screen VDB, no background workqueue
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=n
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Use the mono theme (white background, black text) instead of the default dark theme
CONFIG_LV_USE_THEME_DEFAULT=n
CONFIG_LV_USE_THEME_MONO=y

CONFIG_LV_USE_FLEX=y
